services:
  processor:
    build: ./ml-service
    ports:
      - "8080:8080"
    environment:
      WHISPER_MODEL: turbo
      WHISPER_DEVICE: auto
      WHISPER_COMPUTE_TYPE: int8
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
      ML_SERVICE_TOKEN: change-me
    volumes:
      - whisper-cache:/root/.cache/huggingface
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
volumes:
  whisper-cache:
  ollama-data:
